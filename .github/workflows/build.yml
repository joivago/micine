name: Compilar Mi cine

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto (subido como .zip o como carpetas)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          rm -rf _proyecto && mkdir _proyecto
          if [ -n "$ZIP" ]; then unzip -o -q "$ZIP" -d _proyecto; fi
          DIR=""
          for f in $(find _proyecto . -name settings.gradle.kts -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -f "$d/app/build.gradle.kts" ] && [ -f "$d/dvconv/Cargo.toml" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then echo "No encuentro el proyecto Mi cine. Contenido:"; find . -not -path './.git/*' | head -80; exit 1; fi
          echo "PROJ=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"
          echo "Proyecto en: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Probar el conversor Dolby Vision
        working-directory: ${{ env.PROJ }}/dvconv
        env:
          DOVI_ASSETS: ${{ env.PROJ }}/dvconv/test-assets
        run: cargo test --release

      - name: Compilar el conversor para la SHIELD (ARM)
        working-directory: ${{ env.PROJ }}/dvconv
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -P 26 -o ../app/src/main/jniLibs build --release
          find ../app/src/main/jniLibs -name "*.so" -exec ls -la {} \;

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar la app
        working-directory: ${{ env.PROJ }}
        run: |
          gradle assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Comprobando que el conversor va dentro del APK:"
          unzip -l "$APK" | grep libdvconv
          cp "$APK" "$GITHUB_WORKSPACE/MiCine.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiCine-apk
          path: MiCine.apk

      # El APK queda también en la página de versiones (Releases) del repositorio.
      - name: Publicar el APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' "$PROJ/app/build.gradle.kts" | sed -E 's/.*"(.*)".*/\1/')
          cp MiCine.apk "MiCine-$VER.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "MiCine-$VER.apk" --clobber
          else
            gh release create "v$VER" "MiCine-$VER.apk" --title "Mi cine $VER" --notes "APK compilado por GitHub Actions."
          fi
